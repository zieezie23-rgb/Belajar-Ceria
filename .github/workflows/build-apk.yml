name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q BelajarHurufAngka_APK_Ready.zip

          cat > bh_project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BelajarHurufAngka"
          include(":app")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure Java and Kotlin target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("bh_project/app/build.gradle")
          s = p.read_text()

          marker = "    compileSdk 35"
          replacement = """    compileSdk 35

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }"""

          if "compileOptions" not in s:
              s = s.replace(marker, replacement)

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: bh_project
        run: gradle assembleDebug --no-daemon
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BelajarHurufAngka-APK
          path: bh_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
