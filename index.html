<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6C63FF">
<title>Belajar Ceria — Angka & Huruf</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(135deg,#eef2ff,#fff8ec);font-family:Arial,system-ui,sans-serif;color:#25243a}
.app{max-width:760px;margin:auto;padding:14px 12px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:22px;font-weight:900}.logo b{color:#6c63ff}
.homeBtn{border:0;border-radius:15px;padding:10px 14px;background:white;font-weight:800;box-shadow:0 4px 15px #0001}
.card{background:#fffffff2;border-radius:30px;padding:18px;box-shadow:0 15px 40px #4c45a51a}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.menu button{border:0;border-radius:25px;background:#f4f2ff;padding:24px 12px;font-size:20px;font-weight:900;color:#49419a;box-shadow:0 6px 0 #ddd9f7}
.menu button:active{transform:translateY(4px);box-shadow:0 2px 0 #ddd9f7}
.menu .emoji{font-size:58px;display:block;margin-bottom:10px}
h1{text-align:center;font-size:27px;margin:5px 0}.intro{text-align:center;color:#777;margin:0}
.lesson{display:none}
.nav{display:flex;gap:8px;margin-bottom:12px}
.nav button,.speak,.modeBtn{border:0;border-radius:15px;padding:10px 13px;background:#ecebff;color:#5149b9;font-weight:900}
.nav .grow{flex:1;text-align:center;font-weight:900;padding:10px}
.hero{text-align:center;background:linear-gradient(180deg,#faf9ff,#fff);border-radius:26px;padding:12px 10px 18px}
.heroChar{font-size:clamp(110px,25vw,190px);line-height:.95;font-weight:1000;color:#6c63ff;text-shadow:0 9px 0 #e4e1ff;margin:5px 0 8px}
.heroNum{font-size:clamp(120px,28vw,210px)}
.title{font-size:clamp(28px,7vw,48px);font-weight:1000;margin:5px 0}
.example{font-size:clamp(24px,6vw,40px);font-weight:900;color:#ff5f98;margin:6px}
.pronounce{font-size:clamp(22px,5vw,32px);font-weight:900;margin:10px 0}
.pronounce span{color:#6c63ff}
.spelling{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.spelling span{background:#fff1f6;color:#c53172;border-radius:14px;padding:8px 12px;font-size:22px;font-weight:900}
.instructions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.info{background:#f7f7fb;border-radius:20px;padding:14px;text-align:left}
.info b{display:block;color:#5149b9;margin-bottom:5px;font-size:14px}.info p{margin:0;font-size:17px;font-weight:700}
.controls{display:flex;gap:9px;margin-top:14px}.controls button{flex:1;border:0;border-radius:18px;padding:14px;font-size:15px;font-weight:900}
.prev{background:#ecebff;color:#5149b9}.sound{background:#fff0f6;color:#b52e70}.next{background:#6c63ff;color:white}
.counter{text-align:center;font-weight:900;color:#777;margin-top:10px}
.bigObjects{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;font-size:42px;max-width:560px;margin:10px auto}
.write{position:relative;margin:12px auto;max-width:460px;height:115px;border-radius:18px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 37px,#d9d9e8 38px,#fff 39px);display:flex;align-items:center;justify-content:center;overflow:hidden}
.write .trace{font-size:80px;font-weight:1000;color:#c9c8d8;font-family:cursive}
.write:after{content:"✍️ Ikuti arah tulisan dengan jari";position:absolute;bottom:6px;right:9px;font-size:11px;color:#888;background:#ffffffcc;padding:2px 5px;border-radius:8px}
.tip{margin:10px 0 0;text-align:center;color:#666;font-weight:700}
@media(max-width:430px){.instructions{grid-template-columns:1fr}.menu button{padding:20px 8px}.spelling span{font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">🌈 <b>Belajar</b> Ceria</div>
    <button class="homeBtn" onclick="home()">🏠 Menu</button>
  </div>

  <section id="home" class="card">
    <h1>Belajar Angka & Huruf</h1>
    <p class="intro">Baca, dengarkan, ucapkan, eja, dan belajar cara menulisnya.</p>
    <div class="menu">
      <button onclick="openNumbers()"><span class="emoji">🔢</span>Angka 1–10</button>
      <button onclick="openLetters()"><span class="emoji">🔤</span>Huruf A–Z</button>
    </div>
  </section>

  <section id="lesson" class="card lesson">
    <div class="nav">
      <button onclick="home()">⬅️</button>
      <div class="grow" id="sectionTitle"></div>
    </div>
    <div class="hero">
      <div id="char" class="heroChar">A</div>
      <div id="title" class="title">A — Apel</div>
      <div id="example" class="example">🍎</div>

      <div class="pronounce">🔊 Cara mengucapkan: <span id="pronounce"></span></div>

      <div class="spelling" id="spelling"></div>

      <div class="write">
        <div class="trace" id="trace">A</div>
      </div>
      <div class="tip">✍️ Perhatikan bentuk huruf/angka, lalu ikuti garisnya dengan jari atau pensil.</div>

      <div class="instructions">
        <div class="info"><b>👄 CARA MENGUCAPKAN</b><p id="howSay"></p></div>
        <div class="info"><b>🔤 CARA MENGEJA</b><p id="howSpell"></p></div>
        <div class="info"><b>✍️ CARA MENULIS</b><p id="howWrite"></p></div>
        <div class="info"><b>💡 CONTOH</b><p id="howExample"></p></div>
      </div>
    </div>

    <div class="controls">
      <button class="prev" onclick="prev()">⬅️ Sebelumnya</button>
      <button class="sound" onclick="listen()">🔊 Dengarkan</button>
      <button class="next" onclick="next()">Berikutnya ➡️</button>
    </div>
    <div class="counter" id="counter"></div>
  </section>
</div>

<script>
const letters=[
["A","Apel","🍎","a","A-P-E-L","Mulai dari atas, turun ke kiri dan kanan, lalu buat garis mendatar di tengah.","A seperti pada kata Apel."],
["B","Bola","⚽","be","B-O-L-A","Tarik garis tegak, lalu buat dua lengkungan ke kanan.","B seperti pada kata Bola."],
["C","Ceri","🍒","ce","C-E-R-I","Buat lengkungan terbuka ke arah kanan.","C seperti pada kata Ceri."],
["D","Domba","🐑","de","D-O-M-B-A","Buat garis tegak, lalu satu lengkungan besar ke kanan.","D seperti pada kata Domba."],
["E","Elang","🦅","e","E-L-A-N-G","Buat garis tegak, lalu tiga garis mendatar.","E seperti pada kata Elang."],
["F","Foto","📷","ef","F-O-T-O","Buat garis tegak dan dua garis mendatar di bagian atas dan tengah.","F seperti pada kata Foto."],
["G","Gajah","🐘","ge","G-A-J-A-H","Mulai seperti C, lalu tambahkan garis kecil ke dalam.","G seperti pada kata Gajah."],
["H","Harimau","🐯","ha","H-A-R-I-M-A-U","Buat dua garis tegak, lalu hubungkan dengan garis mendatar.","H seperti pada kata Harimau."],
["I","Ikan","🐟","i","I-K-A-N","Buat satu garis tegak; pada huruf kapital tambahkan garis atas dan bawah.","I seperti pada kata Ikan."],
["J","Jeruk","🍊","je","J-E-R-U-K","Buat garis mendatar di atas lalu lengkungkan garis ke bawah.","J seperti pada kata Jeruk."],
["K","Kucing","🐱","ka","K-U-C-I-N-G","Buat garis tegak, lalu dua garis miring dari tengah.","K seperti pada kata Kucing."],
["L","Lemon","🍋","el","L-E-M-O-N","Buat garis tegak dari atas ke bawah lalu garis mendatar ke kanan.","L seperti pada kata Lemon."],
["M","Mangga","🥭","em","M-A-N-G-G-A","Buat dua garis tegak dengan dua garis miring bertemu di tengah.","M seperti pada kata Mangga."],
["N","Nanas","🍍","en","N-A-N-A-S","Buat garis tegak kiri, garis miring ke kanan bawah, lalu garis tegak kanan.","N seperti pada kata Nanas."],
["O","Obor","🔦","o","O-B-O-R","Buat satu lingkaran tertutup.","O seperti pada kata Obor."],
["P","Pisang","🍌","pe","P-I-S-A-N-G","Buat garis tegak dan satu lengkungan di bagian atas.","P seperti pada kata Pisang."],
["Q","Quran","📖","kiu","Q-U-R-A-N","Buat lingkaran seperti O, lalu tambahkan garis kecil di bagian bawah.","Q seperti pada kata Quran."],
["R","Roti","🍞","er","R-O-T-I","Buat P terlebih dahulu, lalu tambahkan garis miring dari tengah.","R seperti pada kata Roti."],
["S","Sapi","🐄","es","S-A-P-I","Buat dua lengkungan yang membentuk seperti huruf S.","S seperti pada kata Sapi."],
["T","Topi","🎩","te","T-O-P-I","Buat garis mendatar, lalu tarik garis tegak dari tengah.","T seperti pada kata Topi."],
["U","Ular","🐍","u","U-L-A-R","Tarik dua garis turun lalu lengkungkan bagian bawah.","U seperti pada kata Ular."],
["V","Vas","🏺","ve","V-A-S","Buat dua garis miring yang bertemu di bawah.","V seperti pada kata Vas."],
["W","Wortel","🥕","we","W-O-R-T-E-L","Buat empat garis miring yang membentuk dua lembah.","W seperti pada kata Wortel."],
["X","Xylophone","🎵","eks","X-Y-L-O-P-H-O-N-E","Buat dua garis miring yang saling menyilang.","X seperti pada kata Xylophone."],
["Y","Yoyo","🪀","ye","Y-O-Y-O","Buat dua garis miring bertemu, lalu tarik garis turun dari tengah.","Y seperti pada kata Yoyo."],
["Z","Zebra","🦓","zet","Z-E-B-R-A","Buat garis mendatar atas, garis miring, lalu garis mendatar bawah.","Z seperti pada kata Zebra."]
];

const numbers=[
["1","Satu","1","satu","S-A-T-U","Mulai dari atas, buat garis miring kecil lalu tarik garis tegak ke bawah.","Satu benda."],
["2","Dua","2","dua","D-U-A","Buat lengkungan di atas, garis miring ke bawah, lalu garis mendatar.","Dua benda."],
["3","Tiga","3","tiga","T-I-G-A","Buat dua lengkungan yang tersambung seperti angka 3.","Tiga benda."],
["4","Empat","4","empat","E-M-P-A-T","Buat garis tegak, garis mendatar, lalu garis miring turun.","Empat benda."],
["5","Lima","5","lima","L-I-M-A","Buat garis mendatar, turun, lalu lengkungan ke kanan.","Lima benda."],
["6","Enam","6","enam","E-N-A-M","Buat lengkungan ke bawah hingga membentuk lingkaran kecil.","Enam benda."],
["7","Tujuh","7","tujuh","T-U-J-U-H","Buat garis mendatar lalu garis miring turun.","Tujuh benda."],
["8","Delapan","8","delapan","D-E-L-A-P-A-N","Buat dua lingkaran kecil yang bertumpuk.","Delapan benda."],
["9","Sembilan","9","sembilan","S-E-M-B-I-L-A-N","Buat lingkaran di atas lalu tarik garis turun.","Sembilan benda."],
["10","Sepuluh","🔟","sepuluh","S-E-P-U-L-U-H","Tulis angka 1 lalu angka 0 berdampingan.","Sepuluh benda."]
];

let mode="",idx=0;

function home(){document.getElementById("home").style.display="block";document.getElementById("lesson").style.display="none"}
function openLetters(){mode="letters";idx=0;show()}
function openNumbers(){mode="numbers";idx=0;show()}
function data(){return mode==="letters"?letters[idx]:numbers[idx]}
function show(){
 document.getElementById("home").style.display="none";document.getElementById("lesson").style.display="block";
 let d=data(), isL=mode==="letters";
 document.getElementById("sectionTitle").textContent=isL?"🔤 Huruf A–Z":"🔢 Angka 1–10";
 document.getElementById("char").textContent=d[0];document.getElementById("char").className="heroChar "+(isL?"":"heroNum");
 document.getElementById("title").textContent=isL?d[0]+" — "+d[1]:d[0]+" — "+d[1];
 document.getElementById("example").textContent=isL?d[2]: "🔢";
 document.getElementById("pronounce").textContent=d[3];
 document.getElementById("howSay").textContent="Ucapkan: “"+d[3]+"”.";
 document.getElementById("howSpell").textContent=d[4];
 document.getElementById("howWrite").textContent=d[5];
 document.getElementById("howExample").textContent=d[6];
 document.getElementById("trace").textContent=d[0];
 document.getElementById("counter").textContent=(idx+1)+" / "+(isL?26:10);
 let sp=document.getElementById("spelling");sp.innerHTML="";
 (isL?d[0]:d[4]).split("").forEach(x=>{if(x.trim()){let s=document.createElement("span");s.textContent=x;sp.appendChild(s)}});
}
function speak(text){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang="id-ID";u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}}
function listen(){let d=data();speak((mode==="letters"?"Huruf ":"Angka ")+d[0]+". "+d[1]+". Cara mengucapkannya "+d[3]+". Cara mengeja: "+d[4])}
function next(){if(idx<(mode==="letters"?25:9)){idx++;show()}else speak("Ini adalah halaman terakhir.")}
function prev(){if(idx>0){idx--;show()}else speak("Ini adalah halaman pertama.")}
</script>
</body>
</html>
