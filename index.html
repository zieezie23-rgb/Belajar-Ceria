<div id="guide">Ikuti angka dan panah, lalu tulis mengikuti garis putus-putus dengan jari.</div>
</div>
<div id="rotate">📱 Putar HP ke posisi <b>LANDSCAPE</b> untuk belajar 😊</div>

<script>
const letters=[
["A","Apel","🍎","Aaaa","A-P-E-L","Mulai dari atas → turun kiri → turun kanan → garis tengah."],
["B","Bola","⚽","Bee","B-O-L-A","Garis tegak → lengkungan atas → lengkungan bawah."],
["C","Ceri","🍒","Ceee","C-E-R-I","Mulai dari atas → lengkung ke kiri → berhenti di bawah."],
["D","Domba","🐑","Deee","D-O-M-B-A","Garis tegak → lengkungan besar ke kanan."],
["E","Elang","🦅","Eeee","E-L-A-N-G","Garis tegak → garis atas → tengah → bawah."],
["F","Foto","📷","Efff","F-O-T-O","Garis tegak → garis atas → garis tengah."],
["G","Gajah","🐘","Geee","G-A-J-A-H","Lengkung seperti C → tambah garis ke dalam."],
["H","Harimau","🐯","Haaa","H-A-R-I-M-A-U","Garis kiri → garis kanan → hubungkan di tengah."],
["I","Ikan","🐟","Iiii","I-K-A-N","Garis atas → garis tengah → garis bawah."],
["J","Jeruk","🍊","Jeee","J-E-R-U-K","Garis atas → turun → lengkung ke kiri."],
["K","Kucing","🐱","Kaaa","K-U-C-I-N-G","Garis tegak → garis miring atas → garis miring bawah."],
["L","Lemon","🍋","Ellll","L-E-M-O-N","Garis tegak → garis bawah."],
["M","Mangga","🥭","Emmm","M-A-N-G-G-A","Garis kiri → miring naik → miring turun → kanan."],
["N","Nanas","🍍","Ennn","N-A-N-A-S","Garis kiri → diagonal → garis kanan."],
["O","Obor","🔦","Oooo","O-B-O-R","Buat satu lingkaran tertutup."],
["P","Pisang","🍌","Peee","P-I-S-A-N-G","Garis tegak → lengkungan atas."],
["Q","Quran","📖","Kiuuu","Q-U-R-A-N","Lingkaran → tambahkan ekor."],
["R","Roti","🍞","Errr","R-O-T-I","Buat P → tarik garis miring dari tengah."],
["S","Sapi","🐄","Esss","S-A-P-I","Lengkung atas → lengkung bawah membentuk S."],
["T","Topi","🎩","Teee","T-O-P-I","Garis atas → garis tegak tengah."],
["U","Ular","🐍","Uuuu","U-L-A-R","Turun kiri → lengkung bawah → naik kanan."],
["V","Vas","🏺","Veee","V-A-S","Garis miring kiri → bertemu bawah → naik kanan."],
["W","Wortel","🥕","Weee","W-O-R-T-E-L","Turun → naik → turun → naik."],
["X","Xylophone","🎵","Eks","X-Y-L-O-P-H-O-N-E","Garis miring silang dari dua arah."],
["Y","Yoyo","🪀","Yeee","Y-O-Y-O","Dua garis miring bertemu → garis turun."],
["Z","Zebra","🦓","Zet","Z-E-B-R-A","Garis atas → diagonal → garis bawah."]
];
const numbers=[
["1","Satu","1","Saaatu","S-A-T-U","Mulai dari atas → garis miring kecil → turun lurus."],
["2","Dua","2","Duuu-a","D-U-A","Lengkung atas → diagonal turun → garis bawah."],
["3","Tiga","3","Tii-ga","T-I-G-A","Lengkung atas → lengkung bawah."],
["4","Empat","4","Em-paat","E-M-P-A-T","Garis tegak → garis silang → garis tegak."],
["5","Lima","5","Lii-ma","L-I-M-A","Garis atas → turun → lengkung bawah."],
["6","Enam","6","E-naaam","E-N-A-M","Lengkung bawah → lingkaran kecil."],
["7","Tujuh","7","Tujuuuh","T-U-J-U-H","Garis atas → diagonal turun."],
["8","Delapan","8","Delaaapan","D-E-L-A-P-A-N","Lingkaran atas → lingkaran bawah."],
["9","Sembilan","9","Sembilaaaan","S-E-M-B-I-L-A-N","Lingkaran atas → tarik garis turun."],
["10","Sepuluh","🔟","Sepuluh","S-E-P-U-L-U-H","Tulis 1 → lalu tulis 0."]
];

let mode="letters", index=0, favoriteSet=new Set(), drawing=false;
const canvas=document.getElementById("traceCanvas"),ctx=canvas.getContext("2d");

function data(){return mode==="letters"?letters[index]:numbers[index]}
function setMode(m){mode=m;index=0;render();toast(m==="letters"?"🔤 Mode Huruf A–Z":"🔢 Mode Angka 1–10")}
function render(){resizeCanvas();document.getElementById("pageInfo").textContent=(index+1)+" / "+(mode==="letters"?26:10)}
function resizeCanvas(){
 const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;
 canvas.width=Math.max(1,r.width*dpr);canvas.height=Math.max(1,r.height*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);drawGuide(data()[0],mode==="letters")
}
function drawGuide(char,isLetter){
 const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
 ctx.textAlign="center";ctx.textBaseline="middle";
 const fs=isLetter?Math.min(h*.82,w*.66):(char.length>1?Math.min(h*.55,w*.55):Math.min(h*.8,w*.55));
 ctx.font="900 "+fs+"px Arial";ctx.lineWidth=Math.max(5,Math.min(10,w/115));
 ctx.strokeStyle="#171717";ctx.setLineDash([13,13]);ctx.strokeText(char,w/2,h/2-8);
 ctx.setLineWidth=ctx.lineWidth;
 if(isLetter){
  strokeArrow(w*.37,h*.78,w*.49,h*.18,"#ef2673",1);
  strokeArrow(w*.63,h*.78,w*.51,h*.18,"#2185df",2);
  strokeArrow(w*.43,h*.58,w*.57,h*.58,"#54b52e",3);
 }else{
  strokeArrow(w*.5,h*.75,w*.5,h*.25,"#ef2673",1);
  if(char.length>1)strokeArrow(w*.58,h*.66,w*.68,h*.52,"#2185df",2);
 }
}
function strokeArrow(x1,y1,x2,y2,color,n){
 ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=5;ctx.setLineDash([10,12]);
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 const a=Math.atan2(y2-y1,x2-x1),s=16;ctx.setLineDash([]);
 ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-.45),y2-s*Math.sin(a-.45));ctx.lineTo(x2-s*Math.cos(a+.45),y2-s*Math.sin(a+.45));ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.arc(x1+(x2-x1)*.45,y1+(y2-y1)*.45,18,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="900 19px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(n,x1+(x2-x1)*.45,y1+(y2-y1)*.45);ctx.restore()
}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener("pointerdown",e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle="#7139d8";ctx.lineWidth=Math.max(7,Math.min(13,canvas.clientWidth/70));ctx.lineCap="round";ctx.lineJoin="round";ctx.lineTo(p.x,p.y);ctx.stroke()});
canvas.addEventListener("pointerup",()=>drawing=false);canvas.addEventListener("pointercancel",()=>drawing=false);
function clearTrace(){drawGuide(data()[0],mode==="letters");toast("🧽 Bersih! Coba lagi yuk!")}
function nextLesson(){if(index<(mode==="letters"?25:9)){index++;render();speakLesson()}else toast("🌟 Ini halaman terakhir!")}
function prevLesson(){if(index>0){index--;render();speakLesson()}else toast("🌟 Ini halaman pertama!")}
function favorite(){const k=mode+index;if(favoriteSet.has(k)){favoriteSet.delete(k);toast("☆ Dihapus dari favorit")}else{favoriteSet.add(k);toast("⭐ Ditambahkan ke favorit")}}
function speakLesson(){
 const d=data();
 const text=mode==="letters"
  ?`Hai teman! Ini huruf ${d[0]}. Bunyi hurufnya ${d[3]}. Contohnya ${d[0]} untuk ${d[1]}. Yuk eja pelan-pelan. ${d[4].split("-").join("... ")}. Sekarang ikuti garisnya.`
  :`Hai teman! Ini angka ${d[0]}, namanya ${d[1]}. Yuk ucapkan pelan-pelan: ${d[3]}. Kita eja: ${d[4].split("-").join("... ")}.`;
 speak(text)
}
function speak(text){
 if(!("speechSynthesis" in window)){toast("🔊 Browser ini tidak mendukung suara");return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
 u.lang="id-ID";u.rate=.52;u.pitch=1.45;u.volume=1;
 const voices=speechSynthesis.getVoices();
 const v=voices.find(x=>/^id(-|_)/i.test(x.lang))||voices.find(x=>/indones/i.test(x.name));
 if(v)u.voice=v;speechSynthesis.speak(u)
}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1400)}
window.addEventListener("resize",resizeCanvas);
render();
</script>
</body>
</html>
