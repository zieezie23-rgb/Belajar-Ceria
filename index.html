<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#229fe8">
<title>Belajar Ceria — Huruf & Angka</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Arial Rounded MT Bold",Arial,sans-serif;background:#19a6ed;color:#3b2874;touch-action:manipulation}
button{font:inherit;border:0;cursor:pointer}
.app{width:100vw;height:100dvh;overflow:hidden;position:relative;background:linear-gradient(#20a9ef 0 14%,#d8f7ff 55%,#91d86b)}
.bg{position:absolute;inset:0;background:
radial-gradient(circle at 10% 25%,#fff 0 2%,transparent 2.5%),
radial-gradient(circle at 87% 20%,#fff 0 1.8%,transparent 2.3%),
linear-gradient(180deg,transparent 0 62%,#74c45c 62% 100%)}
.top{position:absolute;z-index:5;top:1.2%;left:1%;right:1%;height:10%;display:flex;gap:1%;align-items:center}
.top button,.title{border:3px solid #fff;border-radius:22px;box-shadow:0 4px 0 #9d5a27,0 5px 10px #0003;color:white;font-weight:900;text-shadow:0 2px #693d36;display:flex;align-items:center;justify-content:center;height:82%}
.back{width:13%;background:linear-gradient(#ff719d,#ef2c70);font-size:clamp(11px,1.7vw,28px)}
.points{width:10%;background:linear-gradient(#ffe35c,#ffae19);font-size:clamp(13px,2vw,28px);text-shadow:none;color:#4a2b2b}
.title{flex:1;background:linear-gradient(#9257ec,#5724c7);border-color:#ffe35c;font-size:clamp(17px,2.8vw,40px)}
.voice{width:22%;background:linear-gradient(#ff709e,#eb2771);font-size:clamp(11px,1.6vw,26px)}
.main{position:absolute;z-index:3;left:1%;right:1%;top:13%;bottom:13%;display:grid;grid-template-columns:19% 60% 19%;gap:1%}
.panel,.center{background:#fffefc;border:4px solid white;box-shadow:0 4px 12px #3b73a744;border-radius:25px;overflow:hidden}
.panel{padding:2%;text-align:center}.center{border-color:#f0c54b;position:relative}
.ribbon{background:linear-gradient(#b27bfa,#7840d0);color:#fff;border-radius:12px;padding:7px;font-size:clamp(11px,1.5vw,22px);font-weight:900}
.kid{font-size:clamp(40px,6vw,90px);margin:4% 0}
.speaker{width:clamp(55px,7vw,100px);aspect-ratio:1;border-radius:50%;background:linear-gradient(#b36dff,#7430d2);border:4px solid white;box-shadow:0 4px 8px #0003;font-size:clamp(25px,3.8vw,55px)}
.pronounce{font-size:clamp(17px,2.5vw,36px);font-weight:900;color:#5323a6;margin-top:3%}
.slow{font-size:clamp(9px,1.1vw,15px)}
.center canvas{position:absolute;inset:1.5%;width:97%;height:97%;touch-action:none}
.clear{position:absolute;z-index:4;bottom:2%;left:50%;transform:translateX(-50%);background:linear-gradient(#8be968,#3ba72a);color:#fff;border:3px solid white;border-radius:18px;padding:7px 18px;font-weight:900;font-size:clamp(10px,1.3vw,18px);box-shadow:0 3px 0 #28761c}
.info{position:absolute;z-index:4;left:50%;bottom:10%;transform:translateX(-50%);white-space:nowrap;background:#ffffffdf;border-radius:12px;padding:5px 10px;font-size:clamp(8px,1vw,14px);font-weight:900}
.card{border:2px solid #c5e5ff;border-radius:14px;padding:4%;margin-bottom:5%}
.card h3{margin:-2% -2% 4%;padding:5px;background:#2994df;color:#fff;border-radius:10px;font-size:clamp(11px,1.35vw,20px)}
.example{font-size:clamp(38px,5.5vw,82px)}.word{font-size:clamp(18px,2.4vw,34px);color:#e52d31;font-weight:900}
.spell{display:flex;justify-content:center;gap:3px;flex-wrap:wrap}.spell b{background:#e9f5ff;padding:3px 5px;border-radius:5px;font-size:clamp(11px,1.4vw,21px)}
.quote{font-size:clamp(13px,1.6vw,24px);color:#df4e27;font-weight:900}.tip{font-size:clamp(9px,1.1vw,15px);font-weight:800}
.bottom{position:absolute;z-index:6;left:2%;right:2%;bottom:1%;height:10.5%;display:grid;grid-template-columns:18% 18% 18% 18% 18%;justify-content:space-between}
.nav{border:3px solid white;border-radius:20px;box-shadow:0 4px 0 #a76b1c;color:white;font-weight:900;text-shadow:0 2px #804500;font-size:clamp(9px,1.4vw,21px)}
.prev,.next{background:linear-gradient(#ffdd63,#f4a81c)}.letters{background:linear-gradient(#a45dff,#6829d2)}.numbers{background:linear-gradient(#3dbdff,#1387df)}.fav{background:linear-gradient(#7bdb53,#3ba02d)}
@media(orientation:portrait){
 .top{height:8%;}.back{width:18%}.points{width:14%}.voice{width:24%}.title{font-size:clamp(13px,4.8vw,25px)}
 .main{top:10%;bottom:11%;display:block}.panel{display:none}.center{position:absolute;inset:0}
 .bottom{height:9%;bottom:1%}.nav{border-width:2px;border-radius:13px;font-size:clamp(8px,2.3vw,14px)}
}
</style>
</head>
<body><div class="app"><div class="bg"></div>
<header class="top">
<button class="back" onclick="toast('Kembali')">⬅ Kembali</button>
<div class="points">⭐ <span id="points">25</span></div>
<div class="title">🌟 BELAJAR <span id="modeName">HURUF</span> 🌟</div>
<button class="voice" onclick="speak()">🎙️ Suara Anak</button>
</header>
<section class="main">
<aside class="panel">
<div class="ribbon">Dengar Huruf</div><div class="kid">👦🏻🎤</div>
<button class="speaker" onclick="speak()">🔊</button>
<div id="pronounce" class="pronounce">Aaaa...</div><div class="slow">(diucapkan pelan)</div>
</aside>
<main class="center"><canvas id="board"></canvas><div class="info">① ② ③ Ikuti nomor dan arah panah, lalu tulis dengan jari.</div><button class="clear" onclick="clearBoard()">🧽 Bersihkan</button></main>
<aside class="panel">
<div class="card"><h3>Contoh Kata</h3><div class="example" id="emoji">🍎</div><div class="word" id="word">Apel</div></div>
<div class="card"><h3 style="background:#ed4f83">Cara Mengeja</h3><div id="spell" class="spell"></div></div>
<div class="card"><h3 style="background:#f2ac20">Cara Mengucapkan</h3><div class="quote" id="quote">“Aaaa...”</div></div>
<div class="card"><h3 style="background:#9b62dc">Petunjuk</h3><div class="tip">Mulai dari ①, lanjutkan ②, lalu ③.</div></div>
</aside></section>
<nav class="bottom">
<button class="nav prev" onclick="prev()">⬅ Sebelumnya</button>
<button class="nav letters" onclick="mode='letters';i=0;render()">🔤 Huruf A–Z</button>
<button class="nav numbers" onclick="mode='numbers';i=0;render()">🔢 Angka 1–10</button>
<button class="nav fav" onclick="fav()">⭐ Favorit</button>
<button class="nav next" onclick="next()">Berikutnya ➡</button>
</nav></div>
<script>
const L=[["A", "a", "Apel", "🍎", "A-P-E-L"], ["B", "b", "Bola", "⚽", "B-O-L-A"], ["C", "c", "Ceri", "🍒", "C-E-R-I"], ["D", "d", "Domba", "🐑", "D-O-M-B-A"], ["E", "e", "Elang", "🦅", "E-L-A-N-G"], ["F", "f", "Flamingo", "🦩", "F-L-A-M-I-N-G-O"], ["G", "g", "Gajah", "🐘", "G-A-J-A-H"], ["H", "h", "Harimau", "🐯", "H-A-R-I-M-A-U"], ["I", "i", "Ikan", "🐟", "I-K-A-N"], ["J", "j", "Jeruk", "🍊", "J-E-R-U-K"], ["K", "k", "Kucing", "🐱", "K-U-C-I-N-G"], ["L", "l", "Lemon", "🍋", "L-E-M-O-N"], ["M", "m", "Mangga", "🥭", "M-A-N-G-G-A"], ["N", "n", "Nanas", "🍍", "N-A-N-A-S"], ["O", "o", "Obor", "🔦", "O-B-O-R"], ["P", "p", "Pisang", "🍌", "P-I-S-A-N-G"], ["Q", "q", "Quran", "📖", "Q-U-R-A-N"], ["R", "r", "Roti", "🍞", "R-O-T-I"], ["S", "s", "Sapi", "🐄", "S-A-P-I"], ["T", "t", "Topi", "🎩", "T-O-P-I"], ["U", "u", "Ular", "🐍", "U-L-A-R"], ["V", "v", "Vas", "🏺", "V-A-S"], ["W", "w", "Wortel", "🥕", "W-O-R-T-E-L"], ["X", "x", "Xilofon", "🎵", "X-I-L-O-F-O-N"], ["Y", "y", "Yoyo", "🪀", "Y-O-Y-O"], ["Z", "z", "Zebra", "🦓", "Z-E-B-R-A"]];
const N=[["1", "Satu", "1", "S-A-T-U"], ["2", "Dua", "2", "D-U-A"], ["3", "Tiga", "3", "T-I-G-A"], ["4", "Empat", "4", "E-M-P-A-T"], ["5", "Lima", "5", "L-I-M-A"], ["6", "Enam", "6", "E-N-A-M"], ["7", "Tujuh", "7", "T-U-J-U-H"], ["8", "Delapan", "8", "D-E-L-A-P-A-N"], ["9", "Sembilan", "9", "S-E-M-B-I-L-A-N"], ["10", "Sepuluh", "10", "S-E-P-U-L-U-H"]];
let mode='letters',i=0,draw=false,favorites=new Set();
const data=()=>mode==='letters'?L[i]:N[i], board=document.getElementById('board'),ctx=board.getContext('2d');
function render(){
 const d=data(), letter=mode==='letters'; document.getElementById('modeName').textContent=letter?'HURUF':'ANGKA';
 document.getElementById('pronounce').textContent=letter?d[0]+'aaa...':'Angka '+d[0];
 document.getElementById('emoji').textContent=d[3]; document.getElementById('word').textContent=d[2];
 document.getElementById('quote').textContent='“'+(letter?d[0]+'...':d[1])+'”';
 document.getElementById('spell').innerHTML=d[4].split('-').map(x=>'<b>'+x+'</b>').join('');
 resize(); setTimeout(speak,180);
}
function resize(){let r=board.getBoundingClientRect(),q=devicePixelRatio||1;board.width=r.width*q;board.height=r.height*q;ctx.setTransform(q,0,0,q,0,0);guide()}
function guide(){
 const d=data(),letter=mode==='letters',w=board.clientWidth,h=board.clientHeight;ctx.clearRect(0,0,w,h);
 let fs=letter?Math.min(h*.65,w*.58):(String(d[0]).length>1?Math.min(h*.52,w*.45):Math.min(h*.70,w*.48));
 ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 '+fs+'px Arial';
 // Separate uppercase and lowercase guides.
 if(letter){
   ctx.setLineDash([16,13]);ctx.lineWidth=6;ctx.strokeStyle='#171717';
   ctx.strokeText(d[0],w*.40,h*.43);ctx.strokeText(d[1],w*.65,h*.61);
   ctx.setLineDash([]);
   arrow(w*.26,h*.68,w*.39,h*.18,'#ef2773','1');
   arrow(w*.52,h*.18,w*.52,h*.40,'#268be8','2');
   arrow(w*.55,h*.72,w*.76,h*.58,'#56b52f','3');
 }else{
   ctx.setLineDash([16,13]);ctx.lineWidth=6;ctx.strokeStyle='#171717';ctx.strokeText(d[0],w/2,h*.46);ctx.setLineDash([]);
   arrow(w*.35,h*.72,w*.50,h*.23,'#ef2773','1');arrow(w*.55,h*.23,w*.68,h*.58,'#268be8','2');
 }
}
function arrow(x1,y1,x2,y2,c,n){ctx.save();ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=6;ctx.setLineDash([11,11]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);let a=Math.atan2(y2-y1,x2-x1),s=18;ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-s*Math.cos(a-.5),y2-s*Math.sin(a-.5));ctx.lineTo(x2-s*Math.cos(a+.5),y2-s*Math.sin(a+.5));ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(x1+(x2-x1)*.5,y1+(y2-y1)*.5,19,0,7);ctx.fill();ctx.fillStyle='white';ctx.font='900 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x1+(x2-x1)*.5,y1+(y2-y1)*.5);ctx.restore()}
function pos(e){let r=board.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
board.addEventListener('pointerdown',e=>{draw=true;board.setPointerCapture(e.pointerId);let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
board.addEventListener('pointermove',e=>{if(!draw)return;let p=pos(e);ctx.strokeStyle='#7336d6';ctx.lineWidth=Math.max(6,board.clientWidth/100);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(p.x,p.y);ctx.stroke()});
['pointerup','pointercancel'].forEach(v=>board.addEventListener(v,()=>draw=false));
function clearBoard(){guide();toast('🧽 Bersih! Ayo coba lagi!')}
function next(){let m=mode==='letters'?L.length-1:N.length-1;if(i<m){i++;render()}else toast('🌟 Sudah yang terakhir!')}
function prev(){if(i>0){i--;render()}else toast('🌟 Ini yang pertama!')}
function fav(){let k=mode+i;favorites.has(k)?(favorites.delete(k),toast('☆ Dihapus')):(favorites.add(k),toast('⭐ Favorit disimpan'))}
function speak(){if(!speechSynthesis)return;let d=data(),text=mode==='letters'?`Hai teman! Ini huruf ${d[0]}. ${d[0]} untuk ${d[2]}. Yuk eja pelan-pelan: ${d[4].replaceAll('- ', ', ')}`:`Hai teman! Ini angka ${d[0]}. Namanya ${d[1]}.`;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.45;u.pitch=1.7;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/id[-_]ID/i.test(v.lang))||vs.find(v=>/indones/i.test(v.name))||null;speechSynthesis.speak(u)}
function toast(t){let z=document.createElement('div');z.textContent=t;Object.assign(z.style,{position:'fixed',zIndex:99,left:'50%',top:'14%',transform:'translateX(-50%)',background:'#6636d6',color:'#fff',padding:'9px 18px',borderRadius:'20px',fontWeight:900});document.body.appendChild(z);setTimeout(()=>z.remove(),1100)}
addEventListener('resize',resize);render();
</script></body></html>
